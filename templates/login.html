{% extends "base.html" %}{% block title %}Login {{ login_role|title }}{% endblock %}{% block content %}<main class="auth-wrap"><form class="auth" method="post"><h1>Masuk sebagai {{ login_role }}.</h1><p>Buka QR dan riwayat presensi.</p><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div><div class="field"><label for="nim">NIM</label><input id="nim" name="nim" required inputmode="numeric"></div><button class="btn">Masuk</button><div class="auth-foot">Belum punya akun? <a href="{{ '/register-panitia' if login_role == 'panitia' else '/register' }}">Daftar {{ login_role }}</a></div></form></main>{% endblock %}
