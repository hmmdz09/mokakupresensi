services:
  - type: web
    name: presensi-mokaku-fpmipa-2026
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        value: Mokaku2026!
      - key: DATABASE_URL
        fromDatabase:
          name: presensi-db
          property: connectionString

databases:
  - name: presensi-db
    plan: free
